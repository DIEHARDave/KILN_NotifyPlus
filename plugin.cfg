# notify-plus: add-on for kiln-notify (README.md). Discord cards and
# "Printer on" are done by Moonraker (moonraker/components/notify_plus.py).
# These sections replace kiln-notify's NOTIFY and _NOTIFY (plugins listed
# later in plugins.cfg win) to add zMod's TYPE= switch:
#   _NOTIFY MSG="Door open" TYPE=door
# is skipped while SAVE_VARIABLE VARIABLE=notify_door VALUE=0.

[gcode_macro NOTIFY]
description: Send a notification: MSG="text" [PHOTO=0|1] [TYPE=name]
gcode:
  {% set type = params.TYPE|default("")|lower %}
  {% set muted = type and printer.save_variables.variables["notify_" ~ type]|default(1)|int == 0 %}
  {% if not muted %}
    {action_call_remote_method("kiln_notify", message=params.MSG|default("Test from Kiln OS"), photo=params.PHOTO|default(""))}
  {% endif %}

# zMod's name (its slicer profiles and macros call it)
[gcode_macro _NOTIFY]
gcode:
  {% set type = params.TYPE|default("")|lower %}
  {% set muted = type and printer.save_variables.variables["notify_" ~ type]|default(1)|int == 0 %}
  {% if not muted %}
    {action_call_remote_method("kiln_notify", message=params.MSG|default(""), photo=params.PHOTO|default(""))}
  {% endif %}

[gcode_macro NOTIFY_PLUS_STATUS]
description: Shows whether notifications go out as Discord cards
gcode:
  {action_call_remote_method("notify_plus_status")}
