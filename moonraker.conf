# notify-plus's Moonraker part (Kiln OS includes it while the plugin is
# on). Settings are Klipper variables, see README.md:
#   SAVE_VARIABLE VARIABLE=notify_discord VALUE=0   plain text on Discord
#   SAVE_VARIABLE VARIABLE=notify_on VALUE=0        no "Printer on"
# The card title is kiln-notify's name (NOTIFY_SETUP NAME=).
[notify_plus]

# Updates from Fluidd or Mainsail (Software Updates). After an update,
# restart Moonraker (or reboot) to load it.
[update_manager kiln-notify-plus]
type: git_repo
path: /data/ad5x/plugins/notify-plus
origin: https://github.com/DIEHARDave/KILN_NotifyPlus.git
primary_branch: main
is_system_service: False
